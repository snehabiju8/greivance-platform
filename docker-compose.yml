version: '3.8'

services:
  # 1. Your PostgreSQL database with pgvector pre-installed
  db:
    image: ankane/pgvector:latest
    container_name: grievance_postgres
    environment:
      POSTGRES_DB: grievance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Your Redis Broker for Celery/Channels
  redis:
    image: redis:latest
    container_name: grievance_redis_broker
    ports:
      - "6379:6379"

volumes:
  pgdata: